<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINETIX — Request a Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --ink:#12212e;
    --paper:#f6f3ec;
    --card:rgba(255, 255, 255, 0.88);
    --line:rgba(200, 210, 225, 0.6);
    --brass:#3f7dfa;
    --brass-dark:#2f63d6;
    --ok:#2f6f4f;
    --err:#b3452e;
    --radius:16px;
    --maxjobs:6;
    --field-bg:rgba(253, 252, 250, 0.65);
    --muted:#5a5f6d;
    --hint:#8a8f9c;
    --chip-bg:rgba(228, 238, 255, 0.85);
    --glass-border:1px solid rgba(255, 255, 255, 0.5);
    --glass-shadow:0 8px 32px 0 rgba(63, 125, 250, 0.12);
    --modal-backdrop:linear-gradient(135deg, rgba(100,161,255,0.35), rgba(128,249,183,0.28));

    --sky-1:#64A1FF;   --sky-2:#8BFCFE;
    --mint-1:#9ABDEB;  --mint-2:#80F9B7;
    --berry-1:#F095FF; --berry-2:#F64848;
    --sunset-1:#FC7B7B;--sunset-2:#A6C1FF;
    --citrus-1:#D278F2;--citrus-2:#FCC989;
    --grad-sky:linear-gradient(135deg, var(--sky-1), var(--sky-2));
    --grad-mint:linear-gradient(135deg, var(--mint-1), var(--mint-2));
    --grad-berry:linear-gradient(135deg, var(--berry-1), var(--berry-2));
    --grad-sunset:linear-gradient(135deg, var(--sunset-1), var(--sunset-2));
    --grad-citrus:linear-gradient(135deg, var(--citrus-1), var(--citrus-2));
  }
  body.dark{
    --ink:#eef2f8;
    --paper:#0e1420;
    --card:rgba(24, 30, 42, 0.85);
    --line:rgba(70, 82, 105, 0.6);
    --brass:#7fb4ff;
    --brass-dark:#a8cfff;
    --ok:#6fc79a;
    --err:#e08265;
    --field-bg:rgba(18, 23, 33, 0.6);
    --muted:#a9b2c3;
    --hint:#77869c;
    --chip-bg:rgba(38, 47, 66, 0.85);
    --glass-border:1px solid rgba(255, 255, 255, 0.08);
    --glass-shadow:0 8px 32px 0 rgba(0, 0, 0, 0.5);
    --modal-backdrop:linear-gradient(135deg, rgba(100,161,255,0.22), rgba(128,249,183,0.16));
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    transition:background .4s ease, color .25s ease;
    position:relative;
    overflow-x:hidden;
  }
  .scroll-wash{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    filter:blur(90px);
    opacity:0.45;
    transition:background 0.5s ease;
  }
  body.dark .scroll-wash{opacity:0.3;}
  .wrap{max-width:680px;margin:0 auto;padding:4.5rem 1.25rem 5rem;position:relative;z-index:1;}
  header.hero{
    padding:1rem 0 2rem;
    border-bottom:2px solid var(--ink);
    margin-bottom:2rem;
    text-align:center;
  }
  header.hero h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(1.8rem,5vw,2.4rem);
    margin:0 0 .4rem;
    letter-spacing:-0.01em;
  }
  header.hero p{margin:0 auto;color:var(--muted);font-size:.98rem;max-width:52ch;}

  .card{
    background:var(--card);
    border:var(--glass-border);
    box-shadow:var(--glass-shadow);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-radius:var(--radius);
    padding:1.5rem;
    margin-bottom:1.25rem;
    transition:transform .2s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(63,125,250,0.16);}
  .card h2{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0 0 1.1rem;
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .card h2 i{color:var(--brass);font-size:1rem;}

  .field{margin-bottom:1rem;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:.82rem;
    font-weight:600;
    margin-bottom:.35rem;
    color:var(--ink);
  }
  .field .hint{font-weight:400;color:var(--hint);font-size:.78rem;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
  @media(max-width:520px){.row{grid-template-columns:1fr;}}

  input, textarea, select{
    width:100%;
    padding:.7rem .85rem;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:.95rem;
    background:var(--field-bg);
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, background .25s ease;
  }
  textarea{resize:vertical;min-height:5rem;}
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(168,117,47,0.15);
  }
  input:invalid:not(:placeholder-shown){border-color:var(--err);}
  input[type="file"]{padding:.55rem;}

  .entry{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:1.1rem;
    margin-bottom:.9rem;
    position:relative;
    background:var(--field-bg);
    transition:background .25s ease;
  }
  .entry .entry-num{
    position:absolute;
    top:-.6rem;
    left:.9rem;
    background:var(--ink);
    color:var(--paper);
    font-size:.7rem;
    font-weight:600;
    padding:.15rem .55rem;
    border-radius:20px;
  }
  .entry .remove-entry{
    position:absolute;
    top:.6rem;
    right:.6rem;
    background:none;
    border:none;
    color:#a99;
    cursor:pointer;
    font-size:.95rem;
    padding:.25rem;
    line-height:1;
  }
  .entry .remove-entry:hover{color:var(--err);}

  .add-btn{
    width:100%;
    padding:.7rem;
    background:none;
    border:1.5px dashed var(--line);
    border-radius:8px;
    color:var(--brass-dark);
    font-weight:600;
    font-size:.88rem;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .add-btn:hover{border-color:var(--brass);background:var(--chip-bg);}
  .add-btn:disabled{opacity:.45;cursor:not-allowed;}
  .cap-note{font-size:.75rem;color:var(--hint);margin-top:.4rem;text-align:center;}

  /* CV template picker */
  .template-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.7rem;
  }
  .template-option{
    border:2px solid var(--line);
    border-radius:12px;
    padding:.7rem;
    cursor:pointer;
    background:var(--field-bg);
    transition:border-color .15s ease, transform .15s ease;
  }
  .template-option:hover{transform:translateY(-2px);}
  .template-option.selected{border-color:var(--brass);box-shadow:0 0 0 3px rgba(63,125,250,0.15);}
  .template-name{font-size:.78rem;font-weight:700;margin-top:.5rem;display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
  .template-desc{font-size:.68rem;color:var(--hint);margin-top:.15rem;line-height:1.3;}
  .ats-tag{
    background:var(--ok);color:#fff;font-size:.58rem;font-weight:700;
    padding:.1rem .4rem;border-radius:10px;
  }
  .template-preview{
    height:64px;
    border-radius:6px;
    background:#fff;
    border:1px solid var(--line);
    padding:.4rem .5rem;
    display:flex;
    flex-direction:column;
    gap:.25rem;
    position:relative;
    overflow:hidden;
  }
  .template-preview span{display:block;height:4px;border-radius:2px;background:#c9ced8;width:100%;}
  .template-preview span.short{width:55%;}
  .template-preview span.thin{height:2px;background:#dde1e8;}

  .preview-ats-classic span{background:#9aa4b5;}
  .preview-ats-classic span:first-child{width:70%;margin:0 auto;background:#5a6478;height:6px;}

  .preview-ats-minimal span{background:#9aa4b5;}
  .preview-ats-minimal span:first-child{width:60%;background:#333;height:6px;}

  .preview-navy-sidebar{flex-direction:row;padding:0;gap:0;}
  .preview-navy-sidebar .bar{width:30%;background:#12212e;height:100%;flex-shrink:0;}
  .preview-navy-sidebar .lines{flex:1;padding:.4rem .5rem;display:flex;flex-direction:column;gap:.3rem;justify-content:center;}
  .preview-navy-sidebar .lines span{background:#8bb4ff;}

  .preview-bold-header{padding:0;}
  .preview-bold-header .band{height:22px;background:linear-gradient(90deg,var(--sky-1),var(--mint-2));}
  .preview-bold-header span{margin:.3rem .5rem 0;background:#9aa4b5;}

  .preview-minimalist span{background:#c9ced8;}
  .preview-minimalist span.thin{background:#e4e7ec;}

  .preview-two-column{flex-direction:row;gap:.4rem;}
  .preview-two-column .col{flex:1;display:flex;flex-direction:column;gap:.3rem;justify-content:center;}
  .preview-two-column .col span{background:#9aa4b5;}

  /* Gooey submit button */
  .gooey-wrapper{
    position:relative;
    width:100%;
    height:68px;
    margin-bottom:.5rem;
  }
  .gooey-wrapper.loading, .gooey-wrapper.success{filter:drop-shadow(0 0 10px rgba(100,161,255,0.5));}
  .gooey-submit{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:100%;
    height:60px;
    padding:0;
    background:linear-gradient(135deg, var(--sky-1), var(--mint-2));
    color:#fff;
    border:none;
    border-radius:100px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    z-index:3;
    transition:width .5s cubic-bezier(.65,0,.35,1), border-radius .5s ease, background .4s ease, color .3s ease;
  }
  .gooey-submit:disabled{cursor:not-allowed;}
  .gooey-wrapper.loading .gooey-submit,
  .gooey-wrapper.success .gooey-submit{
    width:60px;
    color:rgba(255,255,255,0);
  }
  .gooey-wrapper.success .gooey-submit{background:linear-gradient(135deg, var(--ok), #4fb98a);}
  .gooey-wrapper.error .gooey-submit{background:linear-gradient(135deg, var(--err), #d9634a);}

  .gooey-loader-wrap{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:60px;height:60px;
    z-index:2;
    opacity:0;
    pointer-events:none;
  }
  .gooey-wrapper.loading .gooey-loader-wrap{opacity:1;}
  .gooey-dot{
    position:absolute;
    top:50%;left:50%;
    width:60px;height:60px;
    margin:-30px 0 0 -30px;
    border-radius:50%;
  }
  .dot-sky{background:var(--sky-1);}
  .dot-mint{background:var(--mint-2);}
  .dot-berry{background:var(--berry-1);}
  .gooey-wrapper.loading .dot-sky{animation:orbit-a 1.6s linear infinite;}
  .gooey-wrapper.loading .dot-mint{animation:orbit-b 1.6s linear infinite;}
  .gooey-wrapper.loading .dot-berry{animation:orbit-c 1.6s linear infinite;}
  @keyframes orbit-a{
    0%{transform:scale(.35) translate(0,0);}
    50%{transform:scale(.35) translate(38px,0);}
    100%{transform:scale(.35) translate(0,0);}
  }
  @keyframes orbit-b{
    0%{transform:scale(.35) translate(0,0) rotate(0deg);}
    50%{transform:scale(.35) translate(-26px,-26px) rotate(0deg);}
    100%{transform:scale(.35) translate(0,0) rotate(0deg);}
  }
  @keyframes orbit-c{
    0%{transform:scale(.35) translate(0,0);}
    50%{transform:scale(.35) translate(-26px,26px);}
    100%{transform:scale(.35) translate(0,0);}
  }

  .gooey-check-wrap{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:60px;height:60px;
    z-index:4;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
  }
  .gooey-wrapper.success .gooey-check-wrap{opacity:1;}
  .gooey-check-wrap svg{width:32px;height:20px;}
  .gooey-check{
    fill:none;
    stroke:#fff;
    stroke-width:10;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1000;
    stroke-dashoffset:1000;
  }
  .gooey-wrapper.success .gooey-check{animation:draw-check .6s .1s ease forwards;}
  @keyframes draw-check{to{stroke-dashoffset:0;}}

  .status{
    margin-top:1rem;
    padding:.85rem 1rem;
    border-radius:8px;
    font-size:.9rem;
    display:none;
  }
  .status.ok{display:block;background:#eaf3ee;color:var(--ok);border:1px solid #bfdccb;}
  .status.err{display:block;background:#fbece7;color:var(--err);border:1px solid #f0c3b4;}

  .error-msg{color:var(--err);font-size:.78rem;margin-top:.3rem;display:none;}
  .field.has-error input, .field.has-error textarea{border-color:var(--err);}
  .field.has-error .error-msg{display:block;}

  body.dark .status.ok{background:#1c3327;border-color:#2f5540;}
  body.dark .status.err{background:#3a2118;border-color:#5c3627;}

  /* Theme toggle */
  /* KINETIX glass liquid nav bar */
  .kinetix-nav{
    position:fixed;top:0;left:0;right:0;z-index:200;
    display:flex;justify-content:center;
    padding:.7rem .6rem;
    pointer-events:none;
  }
  .nav-inner{
    pointer-events:auto;
    display:flex;align-items:center;gap:.3rem;
    background:var(--card);
    border:var(--glass-border);
    box-shadow:var(--glass-shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:50px;
    padding:.35rem .5rem .35rem .8rem;
    max-width:100%;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .nav-inner::-webkit-scrollbar{display:none;}
  .nav-logo-mini{display:flex;flex-shrink:0;}
  .nav-logo-mini svg{width:26px;height:26px;display:block;}
  .nav-links{position:relative;display:flex;gap:.15rem;margin:0 .25rem;flex-shrink:0;}
  .nav-link{
    position:relative;z-index:2;
    padding:.45rem .75rem;
    border-radius:30px;
    font-size:.74rem;
    font-weight:600;
    color:var(--muted);
    text-decoration:none;
    white-space:nowrap;
    transition:color .3s ease;
  }
  .nav-link.active, .nav-link:hover{color:#fff;}
  .nav-liquid{
    position:absolute;top:0;left:0;height:100%;
    background:var(--grad-sky);
    border-radius:30px;
    z-index:1;
    opacity:0;
    transition:left .45s cubic-bezier(.65,0,.35,1), width .45s cubic-bezier(.65,0,.35,1), border-radius .3s ease, opacity .2s ease;
  }
  .nav-theme-btn{
    width:32px;height:32px;border-radius:50%;
    border:none;
    background:var(--field-bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;font-size:.9rem;
    transition:transform .15s ease;
  }
  .nav-theme-btn:hover{transform:scale(1.08);}

  /* Skills — infinite tag input */
  .skills-box{
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
    padding:.6rem;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--field-bg);
  }
  .skill-chip{
    display:flex;
    align-items:center;
    gap:.4rem;
    background:var(--chip-bg);
    color:var(--ink);
    padding:.3rem .5rem .3rem .7rem;
    border-radius:20px;
    font-size:.85rem;
    font-weight:500;
  }
  .skill-chip button{
    background:none;
    border:none;
    color:var(--hint);
    cursor:pointer;
    font-size:.8rem;
    padding:0;
    line-height:1;
    display:flex;
  }
  .skill-chip button:hover{color:var(--err);}
  #skillInput{
    flex:1;
    min-width:120px;
    border:none;
    padding:.3rem;
    background:transparent;
  }
  #skillInput:focus{outline:none;box-shadow:none;}
  .skills-count{font-size:.75rem;color:var(--hint);margin-top:.4rem;}

  /* Animated shimmer heading */
  .kinetix-logo{width:64px;height:64px;margin:0 auto .5rem;display:block;animation:logo-breathe 3s ease-in-out infinite;}
  @keyframes logo-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  header.hero h1{
    background:linear-gradient(100deg, var(--sky-1) 0%, var(--mint-2) 20%, var(--berry-1) 40%, var(--sunset-1) 60%, var(--citrus-1) 80%, var(--sky-1) 100%);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmer 5s linear infinite;
  }
  header.hero .tagline{
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 .7rem;
  }
  @keyframes shimmer{
    0%{background-position:300% center;}
    100%{background-position:-50% center;}
  }
  header.hero .hero-icon{
    display:inline-block;
    animation:float-pulse 2.6s ease-in-out infinite;
  }
  @keyframes float-pulse{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-4px) scale(1.08);}
  }
  @keyframes spin-slow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes bounce-soft{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .icon-spin{display:inline-block;animation:spin-slow 6s linear infinite;}
  .icon-bounce{display:inline-block;animation:bounce-soft 2.2s ease-in-out infinite;}

  /* Skill add button + suggestion chips */
  .skill-add-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--brass), var(--brass-dark));
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:.8rem;
    flex-shrink:0;
    transition:transform .15s ease;
  }
  .skill-add-btn:hover{transform:scale(1.1);}
  .skill-chip i.fa-tag{font-size:.7rem;opacity:.7;margin-right:.1rem;}

  .suggestions-wrap{margin-top:.7rem;}
  .suggestions-label{font-size:.78rem;color:var(--hint);margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem;}
  .suggestions-label i{color:var(--brass);}
  .suggestion-chips{display:flex;flex-wrap:wrap;gap:.4rem;}
  .suggestion-chip{
    display:flex;
    align-items:center;
    gap:.35rem;
    padding:.35rem .65rem;
    border-radius:20px;
    border:1.5px dashed var(--brass);
    background:transparent;
    color:var(--brass-dark);
    font-size:.8rem;
    font-weight:500;
    cursor:pointer;
    transition:all .15s ease;
  }
  .suggestion-chip:hover{background:var(--chip-bg);transform:translateY(-1px);}
  .suggestion-chip.added{
    border-style:solid;
    border-color:var(--ok);
    color:var(--ok);
    opacity:.55;
    cursor:default;
  }
  .suggestion-chip.added:hover{transform:none;background:transparent;}

  /* Glossy animated "add more" button */
  .glossy-btn{
    position:relative;
    overflow:hidden;
    width:100%;
    padding:.75rem;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, #17708a, #0e4f63);
    color:#eafcff;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    box-shadow:0 4px 14px rgba(23,112,138,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .glossy-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(23,112,138,0.45);}
  .glossy-btn::after{
    content:'';
    position:absolute;
    top:0;left:-60%;
    width:40%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
    transform:skewX(-25deg);
    animation:glossy-sweep 2.8s ease-in-out infinite;
  }
  @keyframes glossy-sweep{
    0%{left:-60%;}
    45%{left:120%;}
    100%{left:120%;}
  }

  /* Glass glowing mint-blue dropzone */
  .dropzone{
    position:relative;
    border:1.5px dashed rgba(64,200,220,0.5);
    border-radius:12px;
    background:linear-gradient(135deg, rgba(64,200,220,0.08), rgba(64,150,220,0.04));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    padding:1.6rem 1rem;
    text-align:center;
    cursor:pointer;
    transition:all .2s ease;
    box-shadow:0 0 0 0 rgba(64,200,220,0.4);
    animation:glow-pulse 3s ease-in-out infinite;
  }
  .dropzone:hover, .dropzone.drag-over{
    border-color:#40c8dc;
    background:linear-gradient(135deg, rgba(64,200,220,0.15), rgba(64,150,220,0.08));
  }
  @keyframes glow-pulse{
    0%,100%{box-shadow:0 0 8px 0 rgba(64,200,220,0.15);}
    50%{box-shadow:0 0 18px 4px rgba(64,200,220,0.3);}
  }
  .dropzone i{font-size:1.6rem;color:#22aec4;margin-bottom:.5rem;display:block;}
